name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = docker/Dockerfile*; 3.14 = latest, to catch breakage before the image moves.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # pyodbc links against the unixODBC driver manager; tests never open a SQL Server connection.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
